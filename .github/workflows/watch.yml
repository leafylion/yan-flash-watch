name: yan-flash watch

on:
  # 트리거는 맥 launchd 의 workflow_dispatch 단독(스케줄/블랙아웃은 맥에서 게이트).
  # GitHub 자체 schedule 은 제거(중복 실행·지연·실패메일 방지).
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 期間終了時に自分自身を無効化するため

concurrency:
  group: watch
  cancel-in-progress: false

# この日付（UTC）を過ぎたら cron を自動停止する。延長したいときはここを書き換える。
env:
  WATCH_UNTIL: "2026-12-31"   # 이 날짜 지나면 워크플로 자동 비활성. 중단하려면 이 날짜를 과거로.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop after end date
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%F)" > "$WATCH_UNTIL" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "監視期間終了（$WATCH_UNTIL）。このワークフローを無効化します。"
            gh workflow disable watch.yml --repo "$GITHUB_REPOSITORY"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      # 1) 更新履歴を監視 → 変化があれば Discord 通知
      - name: Run check
        if: steps.guard.outputs.expired != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 check.py

      # 2) 通知用スナップショット(latest.json)は「常に」コミット。
      #    → 後続の翻訳が失敗しても、検出済みの項目が記録されるので同じ通知が重複しない。
      - name: Commit notify state (always)
        if: steps.guard.outputs.expired != 'true'
        run: |
          if [[ -n "$(git status --porcelain state/latest.json docs/update-info.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/latest.json docs/update-info.json
            git commit -m "auto(notify): 更新履歴 스냅샷 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=0
            for n in 1 2 3; do
              if git push 2>/dev/null; then pushed=1; break; fi
              echo "push 경합 — pull --rebase 후 재시도 ($n)"
              git pull --rebase --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
              sleep $((n * 2))
            done
            [ "$pushed" = 1 ] || echo "::warning::push 경합 실패 — 다음 실행에서 재시도(잡은 성공 처리)."
          else
            echo "更新履歴に変化なし。"
          fi

      # 3) 攻略本文をフェーズ別にスナップショット（翻訳の差分検知用）
      - name: Snapshot guide body
        if: steps.guard.outputs.expired != 'true'
        run: python3 tools/fetch_guide.py

      # 4) 本文が変わっていれば Claude(API) で docs/index.html を最新化（失敗しうる）
      - name: Translate if body changed
        if: steps.guard.outputs.expired != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: claude-sonnet-4-6   # JP→KO 번역엔 Sonnet 충분(Opus 대비 ~5배 저렴·더 빠름)
        run: |
          git diff -- state/guide/ > /tmp/guide.diff || true
          if [[ -s /tmp/guide.diff ]]; then
            echo "本文に変更あり。"
            if [[ -z "$ANTHROPIC_API_KEY" ]]; then
              echo "ANTHROPIC_API_KEY 未設定 — 翻訳をスキップ（差分は次回へ持ち越し）。"
              git checkout -- state/guide
              exit 0
            fi
            # 翻訳が失敗しても job は失敗扱いにしない(=失敗メールを出さない)。
            # 差分を戻して次回また再試行させる。
            if ! python3 tools/translate.py /tmp/guide.diff; then
              echo "::warning::翻訳に失敗しました。今回はスキップし、差分を戻して次回再試行します。"
              git checkout -- state/guide
            fi
          else
            echo "本文に変更なし — 翻訳スキップ。"
          fi

      # 5) 翻訳本文(guide スナップショット + docs/index.html)は「翻訳成功時のみ」コミット。
      #    → 失敗時は state/guide が未コミットのまま残り、次回また差分として再試行される。
      - name: Commit translation (on success)
        if: steps.guard.outputs.expired != 'true'
        run: |
          if [[ -n "$(git status --porcelain state/guide docs/index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/guide docs/index.html
            git commit -m "auto(translate): 攻略 본문 동기화 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=0
            for n in 1 2 3; do
              if git push 2>/dev/null; then pushed=1; break; fi
              echo "push 경합 — pull --rebase 후 재시도 ($n)"
              git pull --rebase --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
              sleep $((n * 2))
            done
            [ "$pushed" = 1 ] || echo "::warning::push 경합 실패 — 다음 실행에서 재시도(잡은 성공 처리)."
          else
            echo "本文の翻訳変更なし。"
          fi
