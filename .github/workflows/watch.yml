name: yan-flash watch

on:
  schedule:
    # ── 모든 cron은 UTC 기준 (KST = UTC+9) ──
    # 블랙아웃 KST 03:00~08:59 = UTC 18:00~23:59 → UTC 시각을 0~17로만 한정해 자동 제외.
    # 블랙아웃 직후 첫 실행(KST 09:00 = UTC 00:00)이 스냅샷 diff로 3~8시 변경분을 몰아서 통지.
    #
    # [10분 단위] KST 6/6~6/7  (= UTC 6/6 전체 + 6/7 00:00~14:59)
    - cron: "*/10 0-17 6 6 *"   # UTC 6/6 00~17시 = KST 6/6 09:00 ~ 6/7 02:59
    - cron: "*/10 0-14 7 6 *"   # UTC 6/7 00~14시 = KST 6/7 09:00 ~ 23:59
    #
    # [1시간 단위] KST 6/8 이후 (= UTC 6/7 15:00 부터)
    - cron: "0 15-17 7 6 *"     # UTC 6/7 15~17시 = KST 6/8 00:00~02:59
    - cron: "0 0-17 8-20 6 *"   # UTC 6/8~6/20 00~17시 = KST 매일 09:00~02:59(블랙아웃 제외)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 期間終了時に自分自身を無効化するため

concurrency:
  group: watch
  cancel-in-progress: false

# この日付（UTC）を過ぎたら cron を自動停止する。延長したいときはここを書き換える。
env:
  WATCH_UNTIL: "2026-06-20"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop after end date
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%F)" > "$WATCH_UNTIL" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "監視期間終了（$WATCH_UNTIL）。このワークフローを無効化します。"
            gh workflow disable watch.yml --repo "$GITHUB_REPOSITORY"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      # 1) 更新履歴を監視 → 変化があれば Discord 通知
      - name: Run check
        if: steps.guard.outputs.expired != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 check.py

      # 2) 攻略本文をフェーズ別にスナップショット（翻訳の差分検知用）
      - name: Snapshot guide body
        if: steps.guard.outputs.expired != 'true'
        run: python3 tools/fetch_guide.py

      # 3) 本文が変わっていれば Claude(API) で docs/index.html を最新化
      - name: Translate if body changed
        if: steps.guard.outputs.expired != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: claude-opus-4-8
        run: |
          git diff -- state/guide/ > /tmp/guide.diff || true
          if [[ -s /tmp/guide.diff ]]; then
            echo "本文に変更あり。"
            if [[ -z "$ANTHROPIC_API_KEY" ]]; then
              echo "ANTHROPIC_API_KEY 未設定 — 翻訳をスキップ（スナップショットのみ更新）。"
            else
              python3 tools/translate.py /tmp/guide.diff
            fi
          else
            echo "本文に変更なし — 翻訳スキップ。"
          fi

      # 4) state/ と docs/ の変更をまとめてコミット & プッシュ（→ Pages 自動再ビルド）
      - name: Commit & push if changed
        if: steps.guard.outputs.expired != 'true'
        run: |
          if [[ -n "$(git status --porcelain state/ docs/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/ docs/
            git commit -m "auto: 妖精乱舞 攻略 동기화 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "変更なし。"
          fi
