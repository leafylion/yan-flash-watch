name: yan-flash watch

on:
  # 트리거는 맥 launchd 의 workflow_dispatch 단독(스케줄/블랙아웃은 맥에서 게이트).
  # GitHub 자체 schedule 은 제거(중복 실행·지연·실패메일 방지).
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 期間終了時に自分自身を無効化するため

concurrency:
  group: watch
  cancel-in-progress: false

# この日付（UTC）を過ぎたら cron を自動停止する。延長したいときはここを書き換える。
env:
  WATCH_UNTIL: "2026-12-31"   # 이 날짜 지나면 워크플로 자동 비활성. 중단하려면 이 날짜를 과거로.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop after end date
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%F)" > "$WATCH_UNTIL" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "監視期間終了（$WATCH_UNTIL）。このワークフローを無効化します。"
            gh workflow disable watch.yml --repo "$GITHUB_REPOSITORY"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      # 1) 更新履歴を監視 → 変化があれば Discord 通知
      - name: Run check
        if: steps.guard.outputs.expired != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 check.py

      # 2) 通知用スナップショット(latest.json)は「常に」コミット。
      #    → 後続の翻訳が失敗しても、検出済みの項目が記録されるので同じ通知が重複しない。
      - name: Commit notify state (always)
        if: steps.guard.outputs.expired != 'true'
        run: |
          if [[ -n "$(git status --porcelain state/latest.json docs/update-info.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/latest.json docs/update-info.json
            git commit -m "auto(notify): 更新履歴 스냅샷 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=0
            for n in 1 2 3; do
              if git push 2>/dev/null; then pushed=1; break; fi
              echo "push 경합 — pull --rebase 후 재시도 ($n)"
              git pull --rebase --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
              sleep $((n * 2))
            done
            [ "$pushed" = 1 ] || echo "::warning::push 경합 실패 — 다음 실행에서 재시도(잡은 성공 처리)."
          else
            echo "更新履歴に変化なし。"
          fi

      # 3) 攻略本文をフェーズ別にスナップショット（翻訳の差分検知用）
      - name: Snapshot guide body
        if: steps.guard.outputs.expired != 'true'
        run: python3 tools/fetch_guide.py

      # 4) 本文が変わっていれば Claude(API) で docs/index.html を最新化（失敗しうる）
      - name: Translate if body changed
        if: steps.guard.outputs.expired != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODEL: claude-sonnet-4-6   # JP→KO 번역엔 Sonnet 충분(Opus 대비 ~5배 저렴·더 빠름)
          # 가드 튜닝: 같은 본문 N회 연속 실패 → 서킷 오픈, 이후 COOLDOWN 간격 프로브만.
          TRANSLATE_MAX_FAILS: "3"
          TRANSLATE_COOLDOWN_HOURS: "6"
          TRANSLATE_COST_ALERT_USD: "1.0"
        run: |
          # 신규 phase 파일(예: P4 신설)도 diff에 잡히도록 intent-to-add 선처리.
          # (git diff 는 기본적으로 untracked 신규 파일을 표시하지 않아 새 페이즈가 누락됐었다)
          git add -N state/guide 2>/dev/null || true
          git diff -- state/guide/ > /tmp/guide.diff || true
          if [[ ! -s /tmp/guide.diff ]]; then
            echo "本文に変更なし — 翻訳スキップ。"
            exit 0
          fi
          echo "本文に変更あり。"
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "ANTHROPIC_API_KEY 未設定 — 翻訳をスキップ（差分は次回へ持ち越し）。"
            git checkout -- state/guide
            exit 0
          fi
          # translate.py 종료코드: 0=성공, 2=서킷오픈(호출 차단·토큰0), 1=실패.
          # 어느 경우든 job 자체는 실패시키지 않는다(=실패메일 방지). 가드 상태는 다음 스텝에서 커밋.
          set +e
          python3 tools/translate.py /tmp/guide.diff
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "翻訳成功。"
          elif [[ "$rc" -eq 2 ]]; then
            echo "::warning::[guard] 연속 실패로 서킷 오픈 — 이번 회차는 API 호출 차단(토큰 0). 차분은 다음 회차로."
            git checkout -- state/guide
          else
            echo "::warning::翻訳に失敗しました。差分を戻して次回再試行します（연속 실패 시 자동 차단됩니다）。"
            git checkout -- state/guide
          fi

      # 5) 커밋 규칙:
      #    - 가드/토큰 로그(state/translate_guard.json, state/token_log.jsonl)는 성공·실패 무관 **항상** 반영.
      #      → 연속 실패 카운터가 회차 간 유지되어야 서킷브레이커가 동작한다(스톰 방지의 핵심).
      #    - 번역 본문(state/guide + docs/index.html)은 **성공 시에만** 함께 커밋(실패 시 step 4에서 롤백됨).
      - name: Commit translation + guard state
        if: steps.guard.outputs.expired != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/translate_guard.json state/token_log.jsonl 2>/dev/null || true
          git add state/guide docs/index.html 2>/dev/null || true
          if [[ -z "$(git diff --cached --name-only)" ]]; then
            echo "커밋할 변경 없음(서킷 오픈 무변동 등)."
            exit 0
          fi
          if git diff --cached --name-only | grep -qx 'docs/index.html'; then
            git commit -m "auto(translate): 攻略 본문 동기화 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            git commit -m "auto(guard): 번역 가드/토큰 로그 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          pushed=0
          for n in 1 2 3; do
            if git push 2>/dev/null; then pushed=1; break; fi
            echo "push 경합 — pull --rebase 후 재시도 ($n)"
            git pull --rebase --autostash 2>/dev/null || git rebase --abort 2>/dev/null || true
            sleep $((n * 2))
          done
          [ "$pushed" = 1 ] || echo "::warning::push 경합 실패 — 다음 실행에서 재시도(잡은 성공 처리)."
